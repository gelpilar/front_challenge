
<span id="form_login">
        

    <form (ngSubmit)="log()" >
       
        <span id="texto">
            <h1 id="titulo_form_l">Portal de monitoreo</h1>
            <h2 id="subtitulo_form_l">Iniciar sesión</h2>
<p *ngIf="errorvalidator" style="color: rgb(219, 29, 29);">Error al iniciar sesión: correo o contraseña invalida</p>
        </span>
        <span class="input_container">
            <label >Email</label>
            <input required type="email" name="email" id="email_input" [(ngModel)]="email" placeholder="Correo electrónico" style="margin-bottom: 0rem;" >
            <p  *ngIf="emailvalidator" style="color: red; font-size: 0.75rem; margin: 0; text-align: start; margin-left: 1.3rem; padding: 0%; margin-bottom: 1rem;">Email necesario</p>
        </span>
        <span class="input_container">

        <label >Contraseña</label>
        <input   [attr.type]="opcion" name="password" id="password_input" [(ngModel)]="pass" placeholder="Contraseña">
        <button type="button" id="icono_input" (click)="cambiaropcion()"><svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M9 2.28882e-05C4.90909 2.28882e-05 1.41545 2.48802 0 6.00002C1.41545 9.51202 4.90909 12 9 12C13.0909 12 16.5845 9.51202 18 6.00002C16.5845 2.48802 13.0909 2.28882e-05 9 2.28882e-05ZM8.99924 10C6.74106 10 4.90833 8.208 4.90833 6C4.90833 3.792 6.74106 2 8.99924 2C11.2574 2 13.0901 3.792 13.0901 6C13.0901 8.208 11.2574 10 8.99924 10ZM8.99949 3.59959C7.64131 3.59959 6.54494 4.67159 6.54494 5.99959C6.54494 7.32759 7.64131 8.39959 8.99949 8.39959C10.3577 8.39959 11.454 7.32759 11.454 5.99959C11.454 4.67159 10.3577 3.59959 8.99949 3.59959Z" fill="#84818A"/>
            </svg>
            </button>
            
    </span>
    <p  *ngIf="contravalidator" style="color: red; font-size: 0.75rem; margin: 0; position: relative; bottom: 1rem; right: 0.50rem;">Contraseña necesario</p>
        <span id="botones">
        <a href="">¿Olvidaste tu contraseña?</a>
        <button type="submit"  id="boton_inicio">Ingresar</button>
        </span>
       
    </form>
    <span  id="detalle_texto"><p style="color: gray;">Protegido por reCAPTCHA y sujeto a la <a href="">Política de Privacidad</a> y <a href="">Condiciones.</a></p></span>
    
</span>
